[project]
name = "signal-earnings"
version = "0.1.0"
description = "Do earnings calls sound risky? Multimodal volatility forecasting from text and voice."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "lightgbm>=4.3",
  "yfinance>=0.2", "pyarrow>=15", "matplotlib>=3.8", "scipy>=1.11",
  "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2",
  "transformers>=4.40", "torch>=2.2", "streamlit>=1.36", "plotly>=5.20"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_earnings"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
